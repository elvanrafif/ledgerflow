name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: ledgerflow
          POSTGRES_DB: ledgerflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ledgerflow:ledgerflow@localhost:5432/ledgerflow?schema=public
      SESSION_SECRET: ci-secret-at-least-32-characters-long-ok
      FRONTEND_ORIGIN: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build web
        run: bun run --cwd apps/web build
